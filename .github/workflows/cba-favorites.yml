name: CBA favorites
on:
  push:
    paths: [ '.github/workflows/cba-favorites.yml' ]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          p=Path("index.html"); s=p.read_text(encoding="utf-8")
          marker="</body>"
          if marker not in s: raise SystemExit("body marker not found")
          addon="""<style>
          #cbaFavBox{position:fixed;right:18px;bottom:18px;z-index:9999;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:360px}
          #cbaFavBox button{border:1px solid rgba(255,255,255,.28);background:rgba(18,18,22,.9);color:#fff;padding:10px 14px;border-radius:12px;font:600 13px system-ui;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.25)}
          #cbaFavBox button:hover{background:rgba(42,42,50,.96)}
          #cbaFavMsg{width:100%;text-align:right;color:#fff;font:12px system-ui;min-height:15px}
          </style>
          <div id="cbaFavBox"><div id="cbaFavMsg"></div><button id="cbaSaveFav">♡ Save Favorite</button><button id="cbaLoadFav">♥ Load Favorite</button></div>
          <script>
          (()=>{const KEY='cba.favorite.v1',msg=document.getElementById('cbaFavMsg');
          const flash=t=>{msg.textContent=t;clearTimeout(window.__cbaFavT);window.__cbaFavT=setTimeout(()=>msg.textContent='',1800)};
          const state=()=>({tone1:document.getElementById('c1')?.value,tone2:document.getElementById('c2')?.value,wheel:document.getElementById('wheelColor')?.value,strength:document.getElementById('wheelStrength')?.value,brightness:document.getElementById('wheelBright')?.value,finish:document.querySelector('[data-finish].active')?.dataset?.finish||null});
          document.getElementById('cbaSaveFav').onclick=()=>{localStorage.setItem(KEY,JSON.stringify(state()));flash('Favorite saved')};
          document.getElementById('cbaLoadFav').onclick=()=>{let v;try{v=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}if(!v){flash('No favorite saved yet');return}
          if(v.tone1&&typeof setTone==='function')setTone(1,v.tone1);if(v.tone2&&typeof setTone==='function')setTone(2,v.tone2);
          const ws=document.getElementById('wheelStrength'),wb=document.getElementById('wheelBright');if(ws&&v.strength!=null)ws.value=v.strength;if(wb&&v.brightness!=null)wb.value=v.brightness;
          if(v.wheel&&typeof setWheels==='function')setWheels(v.wheel,'Favorite');
          if(v.finish){const b=document.querySelector('[data-finish="'+v.finish+'"]');if(b)b.click()}
          if(typeof updateWheelFx==='function')updateWheelFx();flash('Favorite loaded')};})();
          <\/script>"""
          s=s.replace(marker,addon+"\n"+marker)
          p.write_text(s,encoding="utf-8")
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add save and load favorite controls [cba-favorites]"
          git push
