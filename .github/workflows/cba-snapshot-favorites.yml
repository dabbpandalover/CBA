name: CBA snapshot favorite markup
on:
  push:
    paths: [ '.github/workflows/cba-snapshot-favorites.yml' ]
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          out=[]
          for term in ["cbaFavBox","data-cba-save","Black Cherry","function setTone","function setWheels","function updateWheelFx"]:
              out.append("\n===== "+term+" =====\n")
              start=0
              while True:
                  i=s.find(term,start)
                  if i<0: break
                  out.append(s[max(0,i-700):min(len(s),i+2200)])
                  start=i+len(term)
          Path("cba-debug.txt").write_text("\n".join(out),encoding="utf-8")
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cba-debug.txt
          git commit -m "Capture CBA favorite diagnostics"
          git push
