name: CBA reset favorites clean
on:
  push:
    paths: [ '.github/workflows/cba-reset-favorites-clean.yml' ]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          import re
          p=Path("index.html"); s=p.read_text(encoding="utf-8")
          # Purge every old favorite UI/style/script/function/hook.
          s=re.sub(r'<style[^>]*id=["\']cbaFavoritesStyle["\'][^>]*>.*?</style>','',s,flags=re.S|re.I)
          s=re.sub(r'<style>\s*#cbaFavBox.*?</style>','',s,flags=re.S|re.I)
          s=re.sub(r'<div[^>]+id=["\'](?:cbaFavorites|cbaFavBox)["\'][^>]*>.*?<div[^>]+id=["\']cbaFavMsg["\'][^>]*></div>\s*</div>','',s,flags=re.S|re.I)
          s=re.sub(r'<button\b[^>]*class=["\'][^"\']*\bfav\b[^"\']*["\'][^>]*>.*?</button>','',s,flags=re.S|re.I)
          s=re.sub(r'<script>\s*\(function\(\)\{.*?cbaSave.*?</script>','',s,flags=re.S|re.I)
          s=re.sub(r'<script>\s*function cbaFlash.*?</script>','',s,flags=re.S|re.I)
          s=re.sub(r'function favorite\(\)\{.*?\}','',s,flags=re.S)
          s=s.replace("document.querySelector('.fav').addEventListener('click',favorite);","")
          # Fresh Favorites only. No dedicated color-combo preset.
          block=r"""<style id="cbaFavoritesStyle">
          #cbaFavorites{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
          #cbaFavorites .slot{display:flex;gap:6px;align-items:center}
          #cbaFavorites button{border:1px solid rgba(255,255,255,.28);background:rgba(18,18,22,.9);color:#fff;padding:8px 12px;border-radius:10px;font:600 13px system-ui;cursor:pointer}
          #cbaFavMsg{flex-basis:100%;min-height:16px;font:12px system-ui;color:#fff}
          </style>
          <div id="cbaFavorites"><b>Favorites</b>
            <div class="slot"><span>1</span><button type="button" data-save-slot="1">Save</button><button type="button" data-load-slot="1">Load</button></div>
            <div class="slot"><span>2</span><button type="button" data-save-slot="2">Save</button><button type="button" data-load-slot="2">Load</button></div>
            <div class="slot"><span>3</span><button type="button" data-save-slot="3">Save</button><button type="button" data-load-slot="3">Load</button></div>
            <div class="slot"><span>4</span><button type="button" data-save-slot="4">Save</button><button type="button" data-load-slot="4">Load</button></div>
            <div id="cbaFavMsg"></div>
          </div>
          <script id="cbaFavoritesScript">
          (function(){
            var KEY='cba-favorite-v3-';
            function q(id){return document.getElementById(id)}
            function msg(t){var m=q('cbaFavMsg');if(m){m.textContent=t;setTimeout(function(){if(m.textContent===t)m.textContent=''},1800)}}
            function get(id){var e=q(id);return e?e.value:''}
            function emit(e){if(!e)return;e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}))}
            function capture(){return {c1:get('c1'),c2:get('c2'),wheelColor:get('wheelColor'),wheelStrength:get('wheelStrength'),wheelBright:get('wheelBright')}}
            function restore(v){[['c1','c1'],['c2','c2'],['wheelColor','wheelColor'],['wheelStrength','wheelStrength'],['wheelBright','wheelBright']].forEach(function(a){var e=q(a[0]);if(e&&v[a[1]]!==undefined){e.value=v[a[1]];emit(e)}})}
            function save(n){try{var data=JSON.stringify(capture());localStorage.setItem(KEY+n,data);if(localStorage.getItem(KEY+n)!==data)throw 0;msg('Slot '+n+' saved ✓')}catch(e){msg('Slot '+n+' could not save')}}
            function load(n){try{var raw=localStorage.getItem(KEY+n);if(!raw){msg('Slot '+n+' is empty');return}restore(JSON.parse(raw));msg('Slot '+n+' loaded ✓')}catch(e){msg('Slot '+n+' could not load')}}
            function init(){
              document.querySelectorAll('[data-save-slot]').forEach(function(b){b.addEventListener('click',function(){save(this.getAttribute('data-save-slot'))})});
              document.querySelectorAll('[data-load-slot]').forEach(function(b){b.addEventListener('click',function(){load(this.getAttribute('data-load-slot'))})});
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
          })();
          </script>"""
          s=s.replace("</body>",block+"\n</body>",1)
          # Assert clean single implementation.
          assert s.count('id="cbaFavorites"')==1
          assert s.count('id="cbaFavoritesScript"')==1
          assert "querySelector('.fav')" not in s
          assert 'class="fav"' not in s
          for n in range(1,5):
              assert s.count('data-save-slot="'+str(n)+'"')==1
              assert s.count('data-load-slot="'+str(n)+'"')==1
          p.write_text(s,encoding="utf-8")
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Purge old favorites and rebuild four clean slots"
          git push
