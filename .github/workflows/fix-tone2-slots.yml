name: Restore rim finish and remove Tone2 slots
on:
  push:
    paths:
      - '.github/workflows/fix-tone2-slots.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          # Restore rim finish controls removed by mistake.
          marker='<div style="margin-top:8px"><label class="note">Brightness <span id="wheelBrightVal" style="float:right">100%</span></label><input id="wheelBright" type="range" min="60" max="145" value="100" style="width:100%"></div>'
          rim='<div class="row" style="margin-top:8px"><button id="wheelPolished">Polished</button><button id="wheelSatin">Satin</button><button id="wheelDark">Dark</button></div>'
          if 'id="wheelPolished"' not in s: s=s.replace(marker,marker+'\n'+rim)
          fn="function wheelPreset(strength,bright,label){wheelStrength.value=strength; wheelBright.value=bright; updateWheelFx(); wheelName.textContent=label+' '+wheelColor.value.toUpperCase();}\n"
          if 'function wheelPreset(' not in s: s=s.replace("makeSwatches('s1',1); makeSwatches('s2',2);",fn+"makeSwatches('s1',1); makeSwatches('s2',2);")
          needle="wheelBright.addEventListener('input',updateWheelFx);"
          handlers=" document.getElementById('wheelPolished').addEventListener('click',()=>wheelPreset(48,125,'Polished')); document.getElementById('wheelSatin').addEventListener('click',()=>wheelPreset(72,100,'Satin')); document.getElementById('wheelDark').addEventListener('click',()=>wheelPreset(88,78,'Dark'));"
          if "getElementById('wheelPolished').addEventListener" not in s: s=s.replace(needle,needle+handlers)
          # Remove the three slot/preset buttons directly below Tone 2, without touching Tone 1/2 swatches or rim finish.
          s=re.sub(r'<div[^>]*class="[^"]*(?:fav|favorite|preset|slot)[^"]*"[^>]*>.*?</div>','',s,flags=re.S|re.I)
          s=re.sub(r'<button[^>]*(?:data-slot|data-favorite|data-preset)[^>]*>.*?</button>','',s,flags=re.S|re.I)
          s=re.sub(r'<button[^>]*>\s*(?:Favorite|Preset|Slot)\s*[123]\s*</button>','',s,flags=re.S|re.I)
          p.write_text(s,encoding="utf-8")
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore rim finish and remove Tone2 favorite preset slots"
          git push
