name: CBA final favorites repair
on:
  push:
    paths: [ '.github/workflows/cba-final-favorites-repair.yml' ]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          import re
          p=Path("index.html"); s=p.read_text(encoding="utf-8")
          # Remove original legacy favorite element by class, plus its JS hook/function.
          s=re.sub(r'<button\b[^>]*class=["\'][^"\']*\bfav\b[^"\']*["\'][^>]*>.*?</button>','',s,flags=re.I|re.S)
          s=re.sub(r'function favorite\(\)\{.*?\}','',s,flags=re.S)
          s=s.replace("document.querySelector('.fav').addEventListener('click',favorite);","")
          # Remove all previously injected favorite blocks/scripts/styles.
          s=re.sub(r'<style>\s*#cbaFavBox.*?</style>','',s,flags=re.S)
          s=re.sub(r'<div id="cbaFavBox">.*?<div id="cbaFavMsg"></div></div>','',s,flags=re.S)
          s=re.sub(r'<script>\s*window\.addEventListener\([\'"]DOMContentLoaded[\'"],function\(\)\{\s*const msg=document\.getElementById\([\'"]cbaFavMsg[\'"]\);.*?</script>','',s,flags=re.S)
          # Remove malformed older injected script text if present.
          s=s.replace("<\\/script>","")
          addon=r"""<style id="cbaFavoritesStyle">
          #cbaFavorites{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
          #cbaFavorites button{border:1px solid rgba(255,255,255,.28);background:rgba(18,18,22,.9);color:#fff;padding:8px 12px;border-radius:10px;font:600 13px system-ui;cursor:pointer}
          #cbaFavorites button:hover{background:rgba(42,42,50,.96)}
          .cbaSlot{display:flex;gap:6px;align-items:center}.cbaSlot span{font:700 12px system-ui;color:#aaa}
          #cbaFavMsg{width:100%;color:#fff;font:12px system-ui;min-height:15px}
          </style>
          <div id="cbaFavorites"><b>Favorites</b>
          <div class="cbaSlot"><span>1</span><button type="button" onclick="cbaSave(1)">Save</button><button type="button" onclick="cbaLoad(1)">Load</button></div>
          <div class="cbaSlot"><span>2</span><button type="button" onclick="cbaSave(2)">Save</button><button type="button" onclick="cbaLoad(2)">Load</button></div>
          <div class="cbaSlot"><span>3</span><button type="button" onclick="cbaSave(3)">Save</button><button type="button" onclick="cbaLoad(3)">Load</button></div>
          <div class="cbaSlot"><span>4</span><button type="button" onclick="cbaSave(4)">Save</button><button type="button" onclick="cbaLoad(4)">Load</button></div>
          <div id="cbaFavMsg"></div></div>
          <script>
          function cbaFlash(t){var m=document.getElementById('cbaFavMsg');if(m){m.textContent=t;clearTimeout(window.__cbaT);window.__cbaT=setTimeout(function(){m.textContent=''},1800)}}
          function cbaState(){return {tone1:c1.value,tone2:c2.value,wheel:wheelColor.value,strength:wheelStrength.value,brightness:wheelBright.value}}
          function cbaSave(n){try{localStorage.setItem('cba.slot.'+n,JSON.stringify(cbaState()));cbaFlash('Saved favorite '+n)}catch(e){cbaFlash('Save failed')}}
          function cbaLoad(n){var v;try{v=JSON.parse(localStorage.getItem('cba.slot.'+n)||'null')}catch(e){}if(!v){cbaFlash('Slot '+n+' is empty');return}if(v.tone1)setTone(1,v.tone1);if(v.tone2)setTone(2,v.tone2);if(v.strength!=null)wheelStrength.value=v.strength;if(v.brightness!=null)wheelBright.value=v.brightness;if(v.wheel)setWheels(v.wheel,'Favorite '+n);updateWheelFx();cbaFlash('Loaded favorite '+n)}
          </script>"""
          s=s.replace("</body>",addon+"\n</body>",1)
          p.write_text(s,encoding="utf-8")
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rebuild four favorite slots and remove legacy favorite"
          git push
