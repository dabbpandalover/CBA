name: CBA verify final favorites
on:
  push:
    paths: [ '.github/workflows/cba-verify-final.yml' ]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          checks={
            "favorites_sections":s.count('id="cbaFavorites"'),
            "slot1":s.count('onclick="cbaSave(1)"'),
            "slot2":s.count('onclick="cbaSave(2)"'),
            "slot3":s.count('onclick="cbaSave(3)"'),
            "slot4":s.count('onclick="cbaSave(4)"'),
            "load4":s.count('onclick="cbaLoad(4)"'),
            "legacy_fav_class":s.count("class=\"fav\""),
            "legacy_favorite_hook":s.count("querySelector('.fav')"),
            "save_function":s.count("function cbaSave(n)"),
            "load_function":s.count("function cbaLoad(n)"),
          }
          ok=(checks["favorites_sections"]==1 and all(checks[k]==1 for k in ["slot1","slot2","slot3","slot4","load4","save_function","load_function"]) and checks["legacy_fav_class"]==0 and checks["legacy_favorite_hook"]==0)
          Path("cba-verification.txt").write_text(str(checks)+"\nPASS="+str(ok)+"\n",encoding="utf-8")
          if not ok: raise SystemExit(str(checks))
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cba-verification.txt
          git commit -m "Verify four-slot favorites implementation"
          git push
