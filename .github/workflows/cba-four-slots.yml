name: CBA four favorite slots
on:
  push:
    paths: [ '.github/workflows/cba-four-slots.yml' ]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          slot3='<div class="cbaSlot"><span>3</span><button type="button" data-cba-save="3">Save</button><button type="button" data-cba-load="3">Load</button></div>'
          slot4='<div class="cbaSlot"><span>4</span><button type="button" data-cba-save="4">Save</button><button type="button" data-cba-load="4">Load</button></div>'
          if 'data-cba-save="4"' not in s:
              if slot3 not in s: raise SystemExit("slot 3 not found")
              s=s.replace(slot3,slot3+slot4,1)
          label="Black Cherry + Dark Plum"
          while label in s:
              i=s.find(label)
              a=s.rfind("<button",0,i)
              b=s.find("</button>",i)
              if a>=0 and b>=0:
                  s=s[:a]+s[b+9:]
                  continue
              a=s.rfind("<option",0,i)
              b=s.find("</option>",i)
              if a>=0 and b>=0:
                  s=s[:a]+s[b+9:]
                  continue
              s=s[:i]+s[i+len(label):]
          p.write_text(s,encoding="utf-8")
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add fourth favorite slot and remove old favorite button"
          git push
