name: CBA favorite slots
on:
  push:
    paths: [ '.github/workflows/cba-favorite-slots.yml' ]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          import re
          p=Path("index.html"); s=p.read_text(encoding="utf-8")
          # Remove old Black Cherry + Dark Plum favorite button, not the colors themselves.
          s=re.sub(r'<button[^>]*>\s*Black Cherry \+ Dark Plum\s*</button>','',s,flags=re.I)
          # Replace current favorite box with three compact save/load slots.
          a=s.find('<div id="cbaFavBox">'); b=s.find('</div>',a)
          if a<0 or b<0: raise SystemExit("favorite box not found")
          b+=6
          box='''<div id="cbaFavBox"><div id="cbaFavMsg"></div><strong style="width:100%;font:700 13px system-ui;color:#fff">Favorites</strong><div class="cbaSlot"><span>1</span><button data-save="1">Save</button><button data-load="1">Load</button></div><div class="cbaSlot"><span>2</span><button data-save="2">Save</button><button data-load="2">Load</button></div><div class="cbaSlot"><span>3</span><button data-save="3">Save</button><button data-load="3">Load</button></div></div>'''
          s=s[:a]+box+s[b:]
          # Extend styles.
          s=s.replace('#cbaFavBox button:hover{background:rgba(42,42,50,.96)}','#cbaFavBox button:hover{background:rgba(42,42,50,.96)} .cbaSlot{display:flex;gap:6px;align-items:center}.cbaSlot span{font:700 12px system-ui;color:#aaa;min-width:12px}')
          # Replace old single-slot favorite script logic with 3 slots.
          start=s.find("(()=>{const KEY='cba.favorite.v1'")
          end=s.find("})();",start)
          if start<0 or end<0: raise SystemExit("favorite script not found")
          end+=5
          js="""(()=>{const msg=document.getElementById('cbaFavMsg');const flash=t=>{msg.textContent=t;clearTimeout(window.__cbaFavT);window.__cbaFavT=setTimeout(()=>msg.textContent='',1800)};const state=()=>({tone1:document.getElementById('c1')?.value,tone2:document.getElementById('c2')?.value,wheel:document.getElementById('wheelColor')?.value,strength:document.getElementById('wheelStrength')?.value,brightness:document.getElementById('wheelBright')?.value,finish:document.querySelector('[data-finish].active')?.dataset?.finish||null});const load=n=>{let v;try{v=JSON.parse(localStorage.getItem('cba.favorite.'+n)||'null')}catch(e){}if(!v){flash('Slot '+n+' is empty');return}if(v.tone1&&typeof setTone==='function')setTone(1,v.tone1);if(v.tone2&&typeof setTone==='function')setTone(2,v.tone2);const ws=document.getElementById('wheelStrength'),wb=document.getElementById('wheelBright');if(ws&&v.strength!=null)ws.value=v.strength;if(wb&&v.brightness!=null)wb.value=v.brightness;if(v.wheel&&typeof setWheels==='function')setWheels(v.wheel,'Favorite '+n);if(v.finish){const b=document.querySelector('[data-finish="'+v.finish+'"]');if(b)b.click()}if(typeof updateWheelFx==='function')updateWheelFx();flash('Loaded favorite '+n)};document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{const n=b.dataset.save;localStorage.setItem('cba.favorite.'+n,JSON.stringify(state()));flash('Saved favorite '+n)});document.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>load(b.dataset.load));})();"""
          s=s[:start]+js+s[end:]
          p.write_text(s,encoding="utf-8")
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Replace old favorite with three save load slots [cba-favorite-slots]"
          git push
