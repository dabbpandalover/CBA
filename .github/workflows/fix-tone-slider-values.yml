name: Fix Tone slider values
on:
  push:
    paths:
      - '.github/workflows/fix-tone-slider-values.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          p=Path("index.html"); s=p.read_text(encoding="utf-8")
          # Bind each range directly to its own displayed value/effect.
          repl={
          'id="tone1Strength" class="toneSlider" type="range"':'id="tone1Strength" class="toneSlider" type="range" oninput="toneFineTune(1)" onchange="toneFineTune(1)"',
          'id="tone1Bright" class="toneSlider" type="range"':'id="tone1Bright" class="toneSlider" type="range" oninput="toneFineTune(1)" onchange="toneFineTune(1)"',
          'id="tone2Strength" class="toneSlider" type="range"':'id="tone2Strength" class="toneSlider" type="range" oninput="toneFineTune(2)" onchange="toneFineTune(2)"',
          'id="tone2Bright" class="toneSlider" type="range"':'id="tone2Bright" class="toneSlider" type="range" oninput="toneFineTune(2)" onchange="toneFineTune(2)"'}
          for a,b in repl.items():
              if a not in s: raise SystemExit("missing "+a)
              s=s.replace(a,b,1)
          # Make fine tune read current DOM values and update labels before applying style.
          a=s.index("function toneFineTune(n){"); b=s.index("function setWheels(",a)
          old=s[a:b]
          new="function toneFineTune(n){const el=n===1?tone1El:tone2El;const st=document.getElementById('tone'+n+'Strength');const br=document.getElementById('tone'+n+'Bright');const sv=document.getElementById('tone'+n+'StrengthVal');const bv=document.getElementById('tone'+n+'BrightVal');const strength=Number(st.value);const bright=Number(br.value);sv.textContent=strength+'%';bv.textContent=bright+'%';el.style.opacity=String(strength/100);el.style.filter='brightness('+bright+'%) contrast(108%)';}\n"
          s=s[:a]+new+s[b:]
          p.write_text(s,encoding="utf-8")
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add index.html
          git commit -m "Fix Tone slider values and live updates"
          git push
