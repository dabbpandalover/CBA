name: White render repair v2
on:
  push:
    paths:
      - '.github/workflows/white-render-repair-v2.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old="const strength=Number(st.value);const bright=Number(br.value);sv.textContent=strength+'%';bv.textContent=bright+'%';el.style.opacity=String(strength/100);el.style.filter='brightness('+bright+'%) contrast(108%)';"
          new="const strength=Number(st.value);const bright=Number(br.value);const input=n===1?c1:c2;const rgb=parseInt(input.value.slice(1),16),r=(rgb>>16)&255,g=(rgb>>8)&255,b=rgb&255,lum=.2126*r+.7152*g+.0722*b;const whiteLift=Math.max(0,Math.min(35,(lum-200)*.64));sv.textContent=strength+'%';bv.textContent=bright+'%';el.style.opacity=String(strength/100);el.style.filter='brightness('+(bright+whiteLift)+'%) contrast('+(108+whiteLift*.2)+'%)';"
          if old not in s: raise SystemExit("fine tune body missing")
          s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8")
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add index.html
          git commit -m "Make white paint visible with smooth light boost"
          git push
